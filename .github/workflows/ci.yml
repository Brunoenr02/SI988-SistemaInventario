name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      # Verificación de secretos: obligatoria para todo el repositorio.
      # Se permite únicamente el JWT público de Supabase en el archivo de configuración cliente.
      - name: Detectar secretos en el repositorio
        run: |
          cat > .trivyignore.yaml <<'EOF'
          secrets:
            - id: jwt-token
              paths:
                - app/lib/core/config/supabase_config.dart
          EOF

          docker run --rm -v "$PWD":/src aquasec/trivy fs \
            --scanners secret \
            --ignorefile /src/.trivyignore.yaml \
            --exit-code 1 \
            /src

      # Flutter: el proyecto móvil está dentro de app.
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependencias Flutter
        working-directory: app
        run: flutter pub get

      - name: Ejecutar análisis estático
        working-directory: app
        run: flutter analyze

      - name: Ejecutar pruebas Flutter
        working-directory: app
        run: flutter test --coverage
